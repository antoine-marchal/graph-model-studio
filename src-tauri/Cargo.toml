[package]
name = "graph-model-studio"
version = "3.7.1"
description = "Graph Model Studio - visual graph & model editor with DSL"
authors = ["Antoine Marchal"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "graph_model_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
